name: pg-lakekeeper-fixture

services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${FIXTURE_DB_PORT:-55432}:5432"

  minio:
    image: ${MINIO_IMAGE}
    environment:
      MINIO_ROOT_USER: minio-root-user
      MINIO_ROOT_PASSWORD: minio-root-password
    command: ["server", "--console-address", ":9001", "/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  createbuckets:
    image: ${MINIO_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set fixture http://minio:9000 minio-root-user minio-root-password
        mc mb --ignore-existing fixture/warehouse

  migrate:
    image: ${LAKEKEEPER_IMAGE}
    environment: &lakekeeper_env
      - LAKEKEEPER__PG_ENCRYPTION_KEY=fixture-key-not-secret
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__AUTHZ_BACKEND=allowall
      - RUST_LOG=info
      - LAKEKEEPER__PG_SCHEMA
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  lakekeeper:
    image: ${LAKEKEEPER_IMAGE}
    environment: *lakekeeper_env
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 1s
      timeout: 5s
      retries: 60
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FIXTURE_LK_PORT:-58181}:8181"
